<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Battleship Unrated</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --success: #22c55e;
      --warning: #fbbf24;
      --purple: #8b5cf6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 12px; }
    
    .app-container { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 10px; }
    
    /* Header / Stats */
    .header-card { background: var(--card-bg); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; border: 1px solid #334155; }
    .title-row { display: flex; justify-content: space-between; align-items: center; }
    h1 { font-size: 1.1rem; color: var(--danger); letter-spacing: 1px; }
    
    .header-controls { display: flex; gap: 6px; align-items: center; }
    .currency-badge { background: #334155; padding: 4px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; color: var(--warning); }
    .icon-btn { background: #334155; border: none; color: white; padding: 5px 8px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; }
    .icon-btn:hover { background: #475569; }

    .stats-row { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--text-muted); }
    
    /* Mode Switch / Tabs */
    .mode-switch { display: flex; gap: 6px; }
    .tab-btn { flex: 1; padding: 10px; background: var(--card-bg); border: 1px solid #334155; color: var(--text-muted); border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 0.85rem; }
    .tab-btn.active { background: var(--accent); color: #0f172a; border-color: var(--accent); }

    /* Status Banner */
    .status-banner { background: var(--card-bg); padding: 8px; text-align: center; border-radius: 6px; font-size: 0.85rem; font-weight: 500; color: var(--accent); }
    
    /* Purchased Power-Ups / Ability Bar */
    .ability-bar { display: flex; gap: 6px; background: var(--card-bg); padding: 6px; border-radius: 8px; border: 1px solid #334155; }
    .ability-btn { flex: 1; padding: 6px; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 6px; font-size: 0.75rem; cursor: pointer; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 4px; }
    .ability-btn.active { border-color: var(--warning); background: #334155; color: var(--warning); }
    .ability-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Action Controls */
    .action-row { display: flex; gap: 6px; }
    .action-btn { flex: 1; padding: 8px; background: #334155; color: white; border: none; border-radius: 6px; font-size: 0.75rem; font-weight: bold; cursor: pointer; }
    .action-btn:hover { background: #475569; }
    .action-btn.pvp { background: var(--purple); }
    .action-btn.pvp:hover { background: #7c3aed; }

    /* Grid Viewport */
    .grid-viewport { background: #020617; border: 2px solid #334155; border-radius: 12px; height: 300px; display: grid; grid-template-columns: repeat(10, 1fr); grid-template-rows: repeat(10, 1fr); gap: 2px; padding: 4px; }
    .grid-cell { background: #1e293b; border-radius: 2px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background 0.15s; }
    .grid-cell.ship-placed { background: var(--accent); }
    .grid-cell.hit { background: var(--danger); }
    .grid-cell.miss { background: #475569; }
    .grid-cell.revealed { background: #eab308; }

    /* Deployment Dock */
    .dock-container { background: var(--card-bg); padding: 10px; border-radius: 8px; display: flex; flex-direction: column; gap: 6px; }
    .dock-title { font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); text-align: center; }
    .dock-ships { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 4px; }
    .dock-ship-btn { padding: 6px 10px; background: #334155; color: white; border: none; border-radius: 4px; font-size: 0.75rem; cursor: pointer; white-space: nowrap; }
    .dock-ship-btn.placed { opacity: 0.4; text-decoration: line-through; }
    .dock-ship-btn.selected { background: var(--accent); color: #0f172a; font-weight: bold; }

    /* Shop Modal Overlay */
    .shop-modal { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.95); z-index: 100; display: none; flex-direction: column; padding: 20px; align-items: center; justify-content: center; gap: 16px; }
    .shop-modal.active { display: flex; }
    .shop-card { background: var(--card-bg); border: 1px solid #334155; border-radius: 12px; width: 100%; max-width: 340px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .shop-item { display: flex; justify-content: space-between; align-items: center; background: #0f172a; padding: 10px; border-radius: 8px; }
    .buy-btn { background: var(--success); color: white; border: none; padding: 6px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .close-shop-btn { background: var(--danger); color: white; border: none; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Header -->
    <div class="header-card">
      <div class="title-row">
        <h1>☠️ BATTLESHIP UNRATED</h1>
        <div class="header-controls">
          <div class="currency-badge" id="shipcoin-count">500 Shipcoins</div>
          <button class="icon-btn" id="sound-btn" onclick="toggleSound()">🔊</button>
        </div>
      </div>
      <div class="stats-row">
        <span>WINS: <strong id="win-count">0</strong></span>
        <span>LOSSES: <strong id="loss-count">0</strong></span>
        <span>RANK: <strong id="rank-display">DEGENERATE</strong></span>
      </div>
    </div>

    <!-- Navigation Tabs -->
    <div class="mode-switch">
      <button class="tab-btn active" id="tab-fleet" onclick="switchTab('fleet')">🛡️ War Fleet</button>
      <button class="tab-btn" id="tab-target" onclick="switchTab('target')">🎯 Fire Grid</button>
      <button class="tab-btn" id="tab-shop" onclick="switchTab('shop')">🛒 Shop</button>
    </div>

    <!-- Status Banner -->
    <div class="status-banner" id="status-display">PLACE YOUR SHIPS OR GET WRECKED.</div>

    <!-- Purchased Power-Ups Bar -->
    <div class="ability-bar">
      <button class="ability-btn" id="ability-normal" onclick="selectAbility('normal')">💥 Standard Shot</button>
      <button class="ability-btn" id="ability-hellfire" onclick="selectAbility('hellfire')" disabled>🔥 Hellfire (<span id="qty-hellfire">0</span>)</button>
      <button class="ability-btn" id="ability-sonar" onclick="selectAbility('sonar')" disabled>📡 Sonar (<span id="qty-sonar">0</span>)</button>
    </div>

    <!-- Grid Viewport -->
    <div class="grid-viewport" id="grid-container"></div>

    <!-- Action Buttons -->
    <div class="action-row">
      <button class="action-btn" id="orientation-btn" onclick="toggleOrientation()">ROTATE (H)</button>
      <button class="action-btn" onclick="autoDeployRandom()">AUTO</button>
      <button class="action-btn" onclick="resetDeployment()">RESET</button>
      <button class="action-btn pvp" onclick="findPvPMatch()">⚔️ FIND PVP</button>
    </div>

    <!-- Fleet Deployment Dock -->
    <div class="dock-container" id="dock-wrapper">
      <div class="dock-title">⚓ Fleet Deployment Dock</div>
      <div class="dock-ships" id="dock-ships"></div>
    </div>
  </div>

  <!-- Shop Modal Overlay -->
  <div class="shop-modal" id="shop-modal">
    <div class="shop-card">
      <h2 style="font-size: 1rem; color: var(--warning);">🛒 BLACK MARKET SHOP</h2>
      <div id="shop-balance-display" style="font-size: 0.85rem; color: var(--text-muted);">BALANCE: 500 SHIPCOINS</div>
      
      <div class="shop-item">
        <div>
          <div style="font-size: 0.85rem; font-weight: bold;">Hellfire Strike</div>
          <div style="font-size: 0.7rem; color: var(--text-muted);">3x3 Cluster Blast</div>
        </div>
        <button class="buy-btn" onclick="buyItem('hellfire', 150)">150 🪙</button>
      </div>

      <div class="shop-item">
        <div>
          <div style="font-size: 0.85rem; font-weight: bold;">Sonar Ping</div>
          <div style="font-size: 0.7rem; color: var(--text-muted);">Reveals enemy ships nearby</div>
        </div>
        <button class="buy-btn" onclick="buyItem('sonar', 100)">100 🪙</button>
      </div>

      <button class="close-shop-btn" onclick="closeShop()">CLOSE SHOP</button>
    </div>
  </div>

  <script>
    let savedStats = JSON.parse(localStorage.getItem('battleship_stats')) || {};
    let stats = {
      shipcoins: typeof savedStats.shipcoins === 'number' ? savedStats.shipcoins : 500,
      wins: typeof savedStats.wins === 'number' ? savedStats.wins : 0,
      losses: typeof savedStats.losses === 'number' ? savedStats.losses : 0,
      rank: savedStats.rank ? savedStats.rank : 'DEGENERATE'
    };
    
    let inventory = JSON.parse(localStorage.getItem('battleship_inventory')) || { hellfire: 0, sonar: 0 };
    let currentTab = 'fleet';
    let currentOrientation = 'H';
    let selectedDockShip = null;
    let selectedAbility = 'normal';
    let placedShips = [];
    
    // Board State arrays
    let playerBoard = Array(100).fill(0);       // Own fleet arrangement
    let targetGridState = Array(100).fill(null); // Opponent fog-of-war grid
    let soundEnabled = true;

    const FLEET_TYPES = [
      { id: 'carrier', name: 'Carrier', size: 5 },
      { id: 'battleship', name: 'Battleship', size: 4 },
      { id: 'cruiser', name: 'Cruiser', size: 3 },
      { id: 'submarine', name: 'Submarine', size: 3 },
      { id: 'destroyer', name: 'Destroyer', size: 2 }
    ];

    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    function triggerHaptic(style) {
      try {
        if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback) {
          if (window.Telegram.WebApp.isVersionAtLeast && window.Telegram.WebApp.isVersionAtLeast('6.1')) {
            window.Telegram.WebApp.HapticFeedback.impactOccurred(style);
          }
        }
      } catch (e) {}
    }

    window.toggleSound = function() {
      soundEnabled = !soundEnabled;
      const soundBtn = document.getElementById('sound-btn');
      if (soundBtn) soundBtn.innerText = soundEnabled ? '🔊' : '🔇';
      updateStatus(soundEnabled ? "Audio blaring." : "Quiet mode activated.");
      triggerHaptic('light');
    };

    window.findPvPMatch = function() {
      if (placedShips.length < 5) {
        alert("Drop all 5 ships first, you can't raw-dog PvP naked!");
        return;
      }
      updateStatus("Hunting down a victim in PvP...");
      triggerHaptic('heavy');
      setTimeout(() => {
        updateStatus("Target locked. Let's rumble.");
        switchTab('target');
      }, 2000);
    };

    window.updateStatsDisplay = function() {
      const coinEl = document.getElementById('shipcoin-count');
      const winEl = document.getElementById('win-count');
      const lossEl = document.getElementById('loss-count');
      const rankEl = document.getElementById('rank-display');

      if (coinEl) coinEl.innerText = `${stats.shipcoins} Shipcoins`;
      if (winEl) winEl.innerText = stats.wins;
      if (lossEl) lossEl.innerText = stats.losses;
      if (rankEl) rankEl.innerText = stats.rank;

      // Update Inventory Abilities
      const hellfireQty = document.getElementById('qty-hellfire');
      const sonarQty = document.getElementById('qty-sonar');
      const hellfireBtn = document.getElementById('ability-hellfire');
      const sonarBtn = document.getElementById('ability-sonar');

      if (hellfireQty) hellfireQty.innerText = inventory.hellfire;
      if (sonarQty) sonarQty.innerText = inventory.sonar;

      if (hellfireBtn) hellfireBtn.disabled = inventory.hellfire <= 0;
      if (sonarBtn) sonarBtn.disabled = inventory.sonar <= 0;
    };

    window.selectAbility = function(ability) {
      if (ability !== 'normal' && inventory[ability] <= 0) return;
      selectedAbility = ability;
      
      document.getElementById('ability-normal').classList.toggle('active', ability === 'normal');
      document.getElementById('ability-hellfire').classList.toggle('active', ability === 'hellfire');
      document.getElementById('ability-sonar').classList.toggle('active', ability === 'sonar');

      updateStatus(`Weapon selected: ${ability.toUpperCase()}`);
      triggerHaptic('light');
    };

    window.updateStatus = function(message) {
      const statusEl = document.getElementById('status-display');
      if (statusEl) statusEl.innerText = message;
    };

    window.renderGrid = function() {
      const gridEl = document.getElementById('grid-container');
      if (!gridEl) return;

      gridEl.innerHTML = '';

      for (let i = 0; i < 100; i++) {
        const cell = document.createElement('div');
        cell.className = 'grid-cell';
        cell.dataset.index = i;

        if (currentTab === 'fleet') {
          // WAR FLEET: Only show your own ships!
          if (playerBoard && playerBoard[i]) {
            cell.classList.add('ship-placed');
          }
        } else if (currentTab === 'target') {
          // FIRE GRID: Hidden fog of war (Only hits/misses/reveals show up)
          if (targetGridState[i]) {
            cell.classList.add(targetGridState[i]);
          }
        }

        cell.addEventListener('click', () => {
          if (currentTab === 'fleet' && selectedDockShip) {
            tryPlaceSelectedShip(i);
          } else if (currentTab === 'target') {
            handleAttack(i);
          }
        });

        gridEl.appendChild(cell);
      }
    };

    function handleAttack(index) {
      if (targetGridState[index] !== null) {
        updateStatus("Already fired at those coordinates!");
        return;
      }

      if (selectedAbility === 'hellfire' && inventory.hellfire > 0) {
        inventory.hellfire--;
        // 3x3 blast area
        const blastIndices = [index, index-1, index+1, index-10, index+10, index-11, index-9, index+9, index+11];
        blastIndices.forEach(idx => {
          if (idx >= 0 && idx < 100) {
            targetGridState[idx] = Math.random() < 0.4 ? 'hit' : 'miss';
          }
        });
        updateStatus("🔥 HELLFIRE STRIKE UNLEASHED!");
        selectAbility('normal');
      } else if (selectedAbility === 'sonar' && inventory.sonar > 0) {
        inventory.sonar--;
        targetGridState[index] = 'revealed';
        updateStatus("📡 Sonar scan complete. Enemy position revealed!");
        selectAbility('normal');
      } else {
        // Standard Shot
        targetGridState[index] = Math.random() < 0.35 ? 'hit' : 'miss';
        updateStatus(targetGridState[index] === 'hit' ? "BOOM! Direct hit!" : "Splash. Total miss.");
      }

      localStorage.setItem('battleship_inventory', JSON.stringify(inventory));
      updateStatsDisplay();
      renderGrid();
      triggerHaptic('medium');
    }

    window.switchTab = function(tab) {
      if (tab === 'shop') {
        openShop();
        return;
      }

      currentTab = tab;

      const fleetBtn = document.getElementById('tab-fleet');
      const targetBtn = document.getElementById('tab-target');
      const shopBtn = document.getElementById('tab-shop');
      const dockWrapper = document.getElementById('dock-wrapper');

      if (fleetBtn) fleetBtn.classList.toggle('active', tab === 'fleet');
      if (targetBtn) targetBtn.classList.toggle('active', tab === 'target');
      if (shopBtn) shopBtn.classList.toggle('active', tab === 'shop');

      if (dockWrapper) {
        dockWrapper.style.display = (tab === 'fleet') ? 'flex' : 'none';
      }

      renderGrid();
      if (tab === 'target') {
        updateStatus("Fire Grid live. Make 'em bleed.");
      } else if (tab === 'fleet') {
        updateStatus("War Fleet locked and loaded.");
      }
    };

    window.openShop = function() {
      const modal = document.getElementById('shop-modal');
      const balanceEl = document.getElementById('shop-balance-display');

      if (balanceEl) {
        balanceEl.innerText = `BALANCE: ${stats.shipcoins} SHIPCOINS`;
      }

      if (modal) modal.classList.add('active');
      triggerHaptic('medium');
    };

    window.closeShop = function() {
      const modal = document.getElementById('shop-modal');
      if (modal) modal.classList.remove('active');
      triggerHaptic('light');
    };

    window.buyItem = function(itemCode, cost) {
      if (stats.shipcoins >= cost) {
        stats.shipcoins -= cost;
        inventory[itemCode] = (inventory[itemCode] || 0) + 1;
        
        localStorage.setItem('battleship_stats', JSON.stringify(stats));
        localStorage.setItem('battleship_inventory', JSON.stringify(inventory));
        
        updateStatsDisplay();
        alert(`Acquired ${itemCode.toUpperCase()}! Check your ability bar during battle.`);
        triggerHaptic('heavy');
      } else {
        alert("You're too broke for this. Go win a match!");
        triggerHaptic('light');
      }
    };

    window.toggleOrientation = function() {
      currentOrientation = (currentOrientation === 'H') ? 'V' : 'H';
      const orientationBtn = document.getElementById('orientation-btn');
      if (orientationBtn) orientationBtn.innerText = `ROTATE (${currentOrientation})`;
      triggerHaptic('light');
    };

    window.resetDeployment = function() {
      placedShips = [];
      playerBoard = Array(100).fill(0);
      renderDock();
      renderGrid();
      updateStatus("Wiped the board. Try again.");
      triggerHaptic('medium');
    };

    window.autoDeployRandom = function() {
      resetDeployment();
      FLEET_TYPES.forEach(ship => {
        let placed = false;
        let attempts = 0;
        while (!placed && attempts < 100) {
          attempts++;
          const orientation = Math.random() < 0.5 ? 'H' : 'V';
          const startIdx = Math.floor(Math.random() * 100);
          if (canPlaceShip(startIdx, ship.size, orientation)) {
            placeShipOnBoard(startIdx, ship.size, orientation, ship.id);
            placed = true;
          }
        }
      });
      renderGrid();
      renderDock();
      updateStatus("Auto-deployed like a true degen.");
      triggerHaptic('heavy');
    };

    function canPlaceShip(index, size, orientation) {
      const row = Math.floor(index / 10);
      const col = index % 10;
      if (orientation === 'H') {
        if (col + size > 10) return false;
        for (let i = 0; i < size; i++) {
          if (playerBoard[index + i] !== 0) return false;
        }
      } else {
        if (row + size > 10) return false;
        for (let i = 0; i < size; i++) {
          if (playerBoard[index + (i * 10)] !== 0) return false;
        }
      }
      return true;
    }

    function placeShipOnBoard(index, size, orientation, shipId) {
      for (let i = 0; i < size; i++) {
        const idx = orientation === 'H' ? index + i : index + (i * 10);
        playerBoard[idx] = shipId;
      }
      placedShips.push({ id: shipId, index, size, orientation });
    }

    function tryPlaceSelectedShip(index) {
      const ship = FLEET_TYPES.find(s => s.id === selectedDockShip);
      if (!ship) return;
      if (canPlaceShip(index, ship.size, currentOrientation)) {
        placeShipOnBoard(index, ship.size, currentOrientation, ship.id);
        selectedDockShip = null;
        renderGrid();
        renderDock();
        updateStatus(`${ship.name} dropped.`);
        triggerHaptic('medium');
      } else {
        updateStatus("Can't put it there, dummy.");
        triggerHaptic('light');
      }
    }

    window.renderDock = function() {
      const dockEl = document.getElementById('dock-ships');
      if (!dockEl) return;
      dockEl.innerHTML = '';
      
      FLEET_TYPES.forEach(ship => {
        const isPlaced = placedShips.some(p => p.id === ship.id);
        const shipBtn = document.createElement('button');
        shipBtn.className = `dock-ship-btn ${isPlaced ? 'placed' : ''} ${selectedDockShip === ship.id ? 'selected' : ''}`;
        shipBtn.innerText = `${ship.name} (${ship.size})`;
        shipBtn.disabled = isPlaced;
        shipBtn.onclick = () => {
          selectedDockShip = ship.id;
          renderDock();
          updateStatus(`Placing ${ship.name}. Pick a spot.`);
          triggerHaptic('light');
        };
        dockEl.appendChild(shipBtn);
      });
    };

    document.addEventListener('DOMContentLoaded', () => {
      updateStatsDisplay();
      renderDock();
      renderGrid();
    });
  </script>
</body>
</html>
